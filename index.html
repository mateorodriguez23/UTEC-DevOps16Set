<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi App Web - Taller DevOps UTEC</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            text-align: center;
            padding: 60px 20px;
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 50px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            max-width: 650px;
            width: 100%;
        }
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 16px;
            background-color: #003478;
            padding: 14px 28px;
            border-radius: 8px;
            margin-bottom: 35px;
        }
        .logo-bar {
            width: 4px;
            height: 48px;
            background-color: #00A859;
            border-radius: 2px;
        }
        .logo-content {
            text-align: left;
        }
        .logo-text {
            color: #ffffff;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1.1;
        }
        .logo-sub {
            color: #7EC8E3;
            font-size: 13px;
            letter-spacing: 0.5px;
            display: block;
            margin-top: 2px;
        }
        h1 {
            color: #003478;
            font-size: 28px;
            margin-bottom: 15px;
            font-weight: 700;
        }
        p {
            color: #555555;
            font-size: 16px;
            line-height: 1.6;
        }
        .badge {
            display: inline-block;
            margin-top: 25px;
            background-color: #e8f5e9;
            color: #2e7d32;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <div class="logo-bar"></div>
            <div class="logo-content">
                <span class="logo-text">UTEC</span>
                <span class="logo-sub">Universidad Tecnológica del Uruguay</span>
            </div>
        </div>

        <h1>¡¡¡Funciona el pipeline de Jenkins!!!</h1>
        <p>Desplegado con Docker desde Jenkins.</p>
        <div class="badge">● Pipeline CI/CD Activo</div>
    </div>

</body>
</html>
